# n8n in queue mode: the main process serves the UI and webhooks and puts
# executions on a Redis queue; workers pull from the queue and run them.
# Scale workers with: docker compose up -d --scale n8n-worker=3
name: n8n-portfolio

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: ${POSTGRES_USER}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  N8N_LISTEN_ADDRESS: 0.0.0.0           # bind IPv4 explicitly (some hosts have no IPv6)
  N8N_WORKER_SERVER_ADDRESS: 0.0.0.0
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"   # workflows read TELEGRAM_CHAT_ID / SIMULATOR_* from env
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  GENERIC_TIMEZONE: ${TZ:-America/El_Salvador}
  TZ: ${TZ:-America/El_Salvador}
  N8N_WEBHOOK_URL: http://localhost:5678/
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  SIMULATOR_NEW_CASES_PER_RUN: ${SIMULATOR_NEW_CASES_PER_RUN:-3}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
      OPS_WRITER_PASSWORD: ${OPS_WRITER_PASSWORD}
      OPS_ANALYST_PASSWORD: ${OPS_ANALYST_PASSWORD}
      TZ: ${TZ:-America/El_Salvador}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ops"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: loads credentials (built from .env) and the workflows in
  # n8n/workflows into n8n's database, then exits. The repo is the source of truth.
  n8n-import:
    image: n8nio/n8n:${N8N_VERSION:-2.42.4}
    environment:
      <<: *n8n-env
      OPS_WRITER_PASSWORD: ${OPS_WRITER_PASSWORD}
      OPS_ANALYST_PASSWORD: ${OPS_ANALYST_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    entrypoint: ["/bin/sh", "/init/import.sh"]
    volumes:
      - ./n8n/init:/init:ro
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.42.4}
    restart: unless-stopped
    environment:
      <<: *n8n-env
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  n8n-worker:
    image: n8nio/n8n:${N8N_VERSION:-2.42.4}
    restart: unless-stopped
    command: worker --concurrency=10
    environment:
      <<: *n8n-env
    depends_on:
      n8n:
        condition: service_healthy

  # One-shot: creates the n8n owner account and publishes the workflows that
  # should run (publishing needs an owner, so it cannot happen at import time).
  n8n-owner:
    image: curlimages/curl:8.11.1
    environment:
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD}
      # Workflows to publish (activate) on boot. 99 · Failure drill stays off.
      ACTIVATE_WORKFLOWS: opsIngestWf00001 opsSimulatorWf01 opsAlertsWf00001 opsAskDataWf001
    entrypoint: ["/bin/sh", "/init/owner.sh"]
    volumes:
      - ./n8n/init:/init:ro
    depends_on:
      n8n:
        condition: service_healthy

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.4.0}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/process-bottlenecks.json
      OPS_ANALYST_PASSWORD: ${OPS_ANALYST_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  grafana_data:
