# Stride & Soul — n8n stack
#
# n8n runs in queue mode: the main process serves the editor and webhooks and
# puts executions on a Redis queue; workers pull and run them. Add workers with:
#   docker compose up -d --scale n8n-worker=3
#
# Postgres holds two databases: "stride_soul" (the store: sales, stock,
# support cases, events, metrics) and "n8n" (n8n's own workflows and history).
# BigQuery (sandbox, free) is the analytics copy, rebuilt every night by n8n.
# Redis is the queue and the agent's chat memory. ngrok gives Telegram the
# public HTTPS address it needs to reach the bot.
name: stride-soul

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: ${POSTGRES_USER}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  N8N_LISTEN_ADDRESS: 0.0.0.0           # bind IPv4 explicitly (some hosts have no IPv6)
  N8N_WORKER_SERVER_ADDRESS: 0.0.0.0
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false" # workflows read the settings below via $env
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_RUNNERS_TASK_TIMEOUT: "300"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "336"        # keep 14 days of execution detail
  GENERIC_TIMEZONE: ${TZ:-America/El_Salvador}
  TZ: ${TZ:-America/El_Salvador}
  N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
  # Read by the workflows
  GCP_PROJECT_ID: ${GCP_PROJECT_ID}
  BQ_DATASET: ${BQ_DATASET:-stride_soul}
  TELEGRAM_ONCALL_CHAT_ID: ${TELEGRAM_ONCALL_CHAT_ID:-}
  USER_HASH_SALT: ${USER_HASH_SALT}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
      SOLE_APP_PASSWORD: ${SOLE_APP_PASSWORD}
      TZ: ${TZ:-America/El_Salvador}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro   # first boot only
      - ./postgres/sql:/sql:ro
      - ./postgres/tests:/tests:ro
    ports:
      - "127.0.0.1:5432:5432"   # reachable from your PC only (pgAdmin, DBeaver)
    healthcheck:
      # TCP only opens after the init scripts finish (they run on a socket-only server)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d stride_soul"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes   # chat memory survives restarts
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: builds n8n credentials from .env and secrets/, imports them and
  # the workflows in n8n/workflows, then exits. The repo is the source of truth.
  n8n-import:
    image: n8nio/n8n:${N8N_VERSION:-2.42.4}
    environment:
      <<: *n8n-env
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SOLE_APP_PASSWORD: ${SOLE_APP_PASSWORD}
    entrypoint: ["/bin/sh", "/init/import.sh"]
    volumes:
      - ./n8n/init:/init:ro
      - ./n8n/workflows:/workflows:ro
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.42.4}
    restart: unless-stopped
    environment:
      <<: *n8n-env
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  n8n-worker:
    image: n8nio/n8n:${N8N_VERSION:-2.42.4}
    restart: unless-stopped
    command: worker --concurrency=10
    environment:
      <<: *n8n-env
    depends_on:
      n8n:
        condition: service_healthy

  # One-shot: creates the owner account (first boot only) and publishes the
  # workflows listed in ACTIVATE_WORKFLOWS. Publishing needs an owner, so it
  # cannot happen at import time.
  n8n-setup:
    image: curlimages/curl:8.11.1
    environment:
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD}
      ACTIVATE_WORKFLOWS: ${ACTIVATE_WORKFLOWS:-}
    entrypoint: ["/bin/sh", "/init/setup.sh"]
    volumes:
      - ./n8n/init:/init:ro
    depends_on:
      n8n:
        condition: service_healthy

  # Public HTTPS tunnel for the Telegram webhook. Enabled by COMPOSE_PROFILES=tunnel
  # in .env once NGROK_AUTHTOKEN and NGROK_DOMAIN are filled in.
  ngrok:
    image: ngrok/ngrok:3
    profiles: ["tunnel"]
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: ["http", "n8n:5678", "--url=${NGROK_DOMAIN:-}", "--log=stdout"]
    ports:
      - "127.0.0.1:4040:4040"   # ngrok inspector: http://localhost:4040
    depends_on:
      n8n:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  n8n_data:
